<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CyberRun 3D - LIMITLESS</title>
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <div id="speed-lines"></div>
    <div id="ui">
      <h1>CYBERRUN : LIMITLESS</h1>
      <p>WASD: Move | SPACE: Double Jump | SHIFT: Dash | E: Grapple Hook (Yellow Pads)</p>
      <div class="stats">
        <div class="stat-box">CHK: <span id="level-display">0</span></div>
        <div class="stat-box">SCORE: <span id="score">0</span></div>
        <div class="stat-box">RECORD CHK: <span id="record-chk">0</span></div>
      </div>
    </div>
    
    <div id="center-msg">LINK ESTABLISHED</div>
    
    <div id="controls">
      <div id="dpad">
        <button id="btn-w">W</button>
        <div class="dpad-row">
          <button id="btn-a">A</button>
          <button id="btn-s">S</button>
          <button id="btn-d">D</button>
        </div>
      </div>
      <div id="action-btns">
        <button id="btn-jump">JUMP</button>
        <button id="btn-dash">DASH</button>
        <button id="btn-grapple">HOOK</button>
      </div>
    </div>
    
    <script type="module" src="./main.js"></script>
  </body>
</html>
